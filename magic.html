<!DOCTYPE html>
<html>
<head>
<style>
    body { text-align: center; font-family: Arial; margin-top: 50px; }
    h1 { color: #e74c3c; }
    button { font-size: 20px; padding: 10px 20px; }
</style>
</head>
<body>
    <h1 id="title">你好，羽 </h1>
    <button onclick="changeText()">点我</button>
    <script>
        function changeText() { document.getElementById("title").innerHTML = "你点击了按钮!"; }
    </script>
</body>
</html>
