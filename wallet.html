<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body { text-align: center; font-family: Arial; margin-top: 80px; }
    h1 { color: #4a90d9; }
    #address { color: #e74c3c; font-size: 18px; word-break: break-all;}
</style>
</head>
<body>
    <h1>我的 DApp</h1>
    <button onclick="connectWallet()">链接钱包</button>
    <p id="address">还没连接</p>
    <script>
        async function connectWallet() { if (typeof window.ethereum !== "undefined") { const accounts = await window.ethereum.request({ method: "eth_requestAccounts" }); document.getElementById("address").innerHTML = "你的地址: " + accounts[0];} else { document.getElementById("address").innerHTML = "没找到钱包, 请安装 MetaMask! "; } }
    </script>
</body>
</html>
